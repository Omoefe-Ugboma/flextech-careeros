
services:
  db:
    image: postgres:16-alpine
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careeros_db
      POSTGRES_USER: careeros_user
      POSTGRES_PASSWORD: careeros_local_dev_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - careeros_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros_user -d careeros_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careeros_postgres_data:
